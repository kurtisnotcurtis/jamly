<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <defs>
    <clipPath id="clip-left">
      <polygon points="0,0 256,0 160,440 0,440"/>
    </clipPath>
    <clipPath id="clip-right">
      <polygon points="276,0 440,0 440,440 180,440"/>
    </clipPath>
  </defs>
  <rect width="440" height="440" rx="96" fill="#9fb2ff"/>

  <!-- Left half: snare drum & drumstick (shifted up-left) -->
  <g clip-path="url(#clip-left)" transform="translate(-9, -6)">
    <line x1="78" y1="112" x2="184" y2="164" stroke="#0f1738" stroke-width="15" stroke-linecap="round"/>
    <circle cx="188" cy="166" r="11" fill="#0f1738"/>
    <path d="M 68 178 L 68 288 C 68 324, 148 338, 234 332 L 248 178 Z" fill="#0f1738"/>
    <ellipse cx="164" cy="178" rx="96" ry="32" fill="#eef1f8" stroke="#0f1738" stroke-width="14"/>
    <path d="M 74 197 C 94 219, 152 227, 222 222" fill="none" stroke="#9fb2ff" stroke-width="9" stroke-linecap="round"/>
    <path d="M 74 283 C 94 309, 152 322, 212 316" fill="none" stroke="#9fb2ff" stroke-width="9" stroke-linecap="round"/>
    <line x1="106" y1="216" x2="106" y2="296" stroke="#9fb2ff" stroke-width="10" stroke-linecap="round"/>
    <line x1="156" y1="224" x2="156" y2="308" stroke="#9fb2ff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Right half: trumpet (shifted down-right) -->
  <g clip-path="url(#clip-right)" transform="translate(9, 6)">
    <rect x="244" y="132" width="16" height="58" rx="5" fill="#0f1738"/>
    <rect x="270" y="132" width="16" height="58" rx="5" fill="#0f1738"/>
    <rect x="296" y="132" width="16" height="58" rx="5" fill="#0f1738"/>
    <rect x="240" y="122" width="24" height="10" rx="5" fill="#0f1738"/>
    <rect x="266" y="122" width="24" height="10" rx="5" fill="#0f1738"/>
    <rect x="292" y="122" width="24" height="10" rx="5" fill="#0f1738"/>
    <path d="M 246 238 L 246 268 C 246 284, 310 284, 310 268 L 310 236" fill="none" stroke="#0f1738" stroke-width="15" stroke-linecap="round"/>
    <path d="M 190 192 L 312 192 C 340 192, 362 166, 382 134 C 389 123, 398 128, 398 142 L 398 290 C 398 304, 389 309, 382 298 C 362 266, 340 240, 312 240 L 180 240 Z" fill="#0f1738"/>
    <rect x="246" y="207" width="64" height="16" rx="8" fill="#9fb2ff"/>
    <ellipse cx="388" cy="216" rx="10" ry="74" fill="#eef1f8" stroke="#0f1738" stroke-width="8"/>
  </g>

  <!-- Dashed cut line along the split channel -->
  <line x1="243.5" y1="104" x2="208.8" y2="262" stroke="#0f1738" stroke-width="8" stroke-dasharray="14 14" stroke-linecap="round"/>

  <!-- Open scissors snipping along the cut -->
  <g transform="translate(195.1, 324) rotate(-77.6)">
    <path d="M 2 2 L 62 -15 L 56 -3 L 4 8 Z" fill="#0f1738"/>
    <path d="M 2 -2 L 62 15 L 56 3 L 4 -8 Z" fill="#0f1738"/>
    <circle cx="8" cy="0" r="4.5" fill="#eef1f8"/>
    <circle cx="-18" cy="-16" r="15" fill="none" stroke="#0f1738" stroke-width="10"/>
    <circle cx="-18" cy="16" r="15" fill="none" stroke="#0f1738" stroke-width="10"/>
  </g>
</svg>
