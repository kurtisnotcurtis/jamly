<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <rect width="440" height="440" rx="96" fill="#9fb2ff"/>

  <!-- Jam dripping from the underside of the butterknife blade to form beamed eighth notes (♫) -->
  <g fill="#0f1738">
    <path d="M 96 170
             L 284 134
             C 278 148, 276 164, 276 184
             L 276 308
             L 242 308
             L 242 198
             C 242 176, 226 176, 220 198
             C 214 218, 206 228, 194 228
             C 182 228, 174 218, 168 198
             C 162 176, 144 180, 144 206
             L 144 330
             L 110 330
             L 110 206
             C 110 186, 104 178, 96 170 Z"/>
    <ellipse cx="96" cy="339" rx="50" ry="35" transform="rotate(-22 96 339)"/>
    <ellipse cx="228" cy="317" rx="50" ry="35" transform="rotate(-22 228 317)"/>
  </g>

  <!-- Butterknife angled at -11 deg forming the top beam of ♫ -->
  <g transform="translate(228, 128) rotate(-11)">
    <path d="M 44 -14
             C 72 -14, 108 -22, 138 -22
             C 156 -22, 168 -11, 168 3
             C 168 17, 156 28, 138 28
             C 108 28, 72 20, 44 20 Z"
          fill="#0f1738" stroke="#0f1738" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="138" cy="3" r="9" fill="#9fb2ff"/>
    <path d="M 48 -28
             L -128 -28
             C -160 -28, -178 -10, -178 10
             C -178 28, -154 40, -112 40
             C -60 40, -4 34, 36 26
             L 48 16 Z"
          fill="#eef1f8" stroke="#0f1738" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
