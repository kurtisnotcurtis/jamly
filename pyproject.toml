[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jamly-audio-sep"
version = "0.0.2"
description = "Split media URLs into drums and drumless practice audio with Hybrid Transformer Demucs v4."
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {text = "MIT"}
keywords = ["audio", "demucs", "htdemucs", "stem-separation", "yt-dlp"]
dependencies = [
    "demucs>=4.0.0,<5",
    "numpy>=1.23,<2",
    "soundfile>=0.11",
    "yt-dlp>=2022.11.11",
]

[project.scripts]
jamly = "jamly.run:main"

[tool.setuptools.packages.find]
where = ["src"]
