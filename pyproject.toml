[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jamly-audio-sep"
version = "0.0.3"
description = "Split media URLs into drums and drumless practice audio locally with Demucs v4."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
keywords = ["audio", "demucs", "stem-separation", "yt-dlp"]
dependencies = [
    "demucs>=4.0.0,<5",
    "filelock>=3.12",
    "numpy>=1.24,<2",
    "platformdirs>=3.8",
    "soundfile>=0.12",
    "yt-dlp>=2023.6.22",
]

[project.scripts]
jamly = "jamly.run:main"
jamly-doctor = "jamly.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
