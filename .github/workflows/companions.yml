name: Companion packages

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-2022
            label: windows-x86_64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: false
      - name: Configure uv cache directory
        run: printf 'UV_CACHE_DIR=%s/uv-cache\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Restore uv cache (with prefix fallback across lockfile bumps)
        id: uv-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-bundle-${{ matrix.label }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-bundle-${{ matrix.label }}-3.12-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os == 'Linux'
        with:
          node-version: "24"
      - name: Cache pinned native builds (non-release builds only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/native-audio
          key: native-audio-${{ matrix.label }}-${{ hashFiles('tools/native_audio.py', 'tools/native-sources.json') }}
      - name: Install native build tools on Linux
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential pkg-config perl pigz
      - name: Install native build tools on macOS
        if: runner.os == 'macOS' && steps.native-cache.outputs.cache-hit != 'true'
        run: command -v pkg-config || brew install pkg-config
      - name: Install native build tools on Windows
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            make
            perl
            perl-locale-maketext-simple
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
      - id: uv-sync
        run: uv sync --locked --no-dev --group bundle --managed-python --python 3.12
      - name: Use pinned CPU-only PyTorch in the Linux companion bundle
        if: runner.os == 'Linux'
        run: uv run --no-sync python tools/install_linux_cpu_torch.py
      - name: Verify lockstep version metadata
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            uv run --no-sync python tools/version.py --check --tag "${GITHUB_REF_NAME}"
          else
            uv run --no-sync python tools/version.py --check
          fi
      - name: Cache Python runtime notices (non-release builds only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/python-notices
          key: python-notices-${{ matrix.label }}-3.12-${{ hashFiles('tools/build_companion.py') }}
          restore-keys: |
            python-notices-${{ matrix.label }}-3.12-
      - name: Cache Demucs smoke-test checkpoints (non-release builds only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/torch/hub/checkpoints
            ~/.cache/huggingface/hub
          key: demucs-smoke-models-${{ runner.os }}-v1
      - name: Build companion on macOS or Linux
        if: runner.os != 'Windows'
        run: |
          REBUILD_FLAG=()
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            REBUILD_FLAG=(--rebuild-native)
          fi
          if [[ "${{ matrix.label }}" == "linux-x86_64" ]]; then
            uv run --no-sync python tools/build_companion.py "${REBUILD_FLAG[@]}"
          else
            uv run --no-sync python tools/build_companion.py --skip-native-sources "${REBUILD_FLAG[@]}"
          fi
      - name: Build companion on Windows (compile native tools)
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          REBUILD_FLAG=()
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            REBUILD_FLAG=(--rebuild-native)
          fi
          uv run --no-sync python tools/build_companion.py --skip-native-sources "${REBUILD_FLAG[@]}"
      - name: Build companion on Windows (reuse cached native tools)
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit == 'true'
        run: uv run --no-sync python tools/build_companion.py --skip-native-sources
      - name: Relocate and exercise the packaged runtime
        run: uv run --no-sync python tools/bundle_smoke.py --real-models
      - name: Real Chrome using the packaged companion
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: node tools/browser_smoke.mjs --runtime dist/desktop/Jamly/jamly-runtime
      - name: Preserve completed native builds even if a later check fails
        if: always() && !cancelled() && !startsWith(github.ref, 'refs/tags/v') && steps.native-cache.outputs.cache-hit != 'true' && hashFiles('build/native-audio/built.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/native-audio
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Prune uv cache before saving
        if: always() && !cancelled() && steps.uv-sync.outcome == 'success' && steps.uv-cache.outputs.cache-hit != 'true'
        run: uv cache prune --ci
      - name: Save uv cache
        if: always() && !cancelled() && steps.uv-sync.outcome == 'success' && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
      - name: Upload unsigned preview and corresponding sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Jamly-${{ matrix.label }}
          path: dist/companions/*
          compression-level: 0
          retention-days: 14
      - name: Preserve build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-logs-${{ matrix.label }}
          path: |
            build/native-audio/build.log
            build/pyinstaller/**/warn-*.txt
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify release tag matches version metadata
        run: python3 tools/version.py --check --tag "${GITHUB_REF_NAME}"
      - name: Download companion artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Jamly-*
          path: dist/release
          merge-multiple: true
      - name: Package browser extension, package manifests, and consolidated checksums
        run: |
          VERSION="$(python3 tools/version.py --check --tag "${GITHUB_REF_NAME}")"
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import zipfile

          sys.path.insert(0, "tools")
          from package_render import sha256_file
          from render_aur import render_aur_package
          from render_homebrew import render_homebrew_cask
          from render_winget import render_winget_manifests

          version = sys.argv[1]
          release_dir = Path("dist/release")
          release_dir.mkdir(parents=True, exist_ok=True)

          ext_zip = release_dir / f"Jamly-{version}-browser-extension.zip"
          with zipfile.ZipFile(ext_zip, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(Path("browser/extension").iterdir()):
                  if path.is_file() and not path.name.endswith("_test.js"):
                      zf.write(path, path.name)

          shutil.copyfile(
              Path("browser/userscripts/jamly.user.js"),
              release_dir / f"Jamly-{version}-jamly.user.js",
          )

          win_zip = release_dir / f"Jamly-{version}-win32-amd64.zip"
          render_winget_manifests(
              version,
              sha256_file(win_zip).upper(),
              Path("dist/manifests/winget"),
              zip_path=release_dir / f"winget-manifests-{version}.zip",
          )

          linux_tar = release_dir / f"Jamly-{version}-linux-x86_64.tar.gz"
          render_aur_package(
              version,
              sha256_file(linux_tar),
              Path("dist/manifests/aur"),
              zip_path=release_dir / f"aur-jamly-bin-{version}.zip",
          )

          mac_arm64_zip = release_dir / f"Jamly-{version}-darwin-arm64.zip"
          render_homebrew_cask(
              version,
              sha256_file(mac_arm64_zip),
              Path("dist/manifests/homebrew"),
              zip_path=release_dir / f"homebrew-tap-{version}.zip",
          )

          checksum_lines = []
          for asset in sorted(release_dir.iterdir()):
              if asset.is_file() and not asset.name.endswith(".sha256") and asset.name != "SHA256SUMS.txt":
                  digest = sha256_file(asset)
                  checksum_lines.append(f"{digest}  {asset.name}\n")
          (release_dir / "SHA256SUMS.txt").write_text("".join(checksum_lines), encoding="utf-8")
          PY
      - name: Upload rendered package manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-manifests
          path: dist/manifests
          retention-days: 7
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite published release assets." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --title "Jamly ${GITHUB_REF_NAME}" \
            --generate-notes

  publish-homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HAS_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
    steps:
      - name: Download rendered manifests
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-manifests
          path: manifests
      - name: Push cask to kurtisnotcurtis/homebrew-tap
        if: env.HAS_DEPLOY_KEY == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/homebrew_tap
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/homebrew_tap -o IdentitiesOnly=yes"
          git clone git@github.com:kurtisnotcurtis/homebrew-tap.git tap-repo
          mkdir -p tap-repo/Casks
          cp manifests/homebrew/Casks/jamly.rb tap-repo/Casks/jamly.rb
          cd tap-repo
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/jamly.rb
            git commit -m "jamly ${VERSION}"
            git push origin HEAD:main
          fi
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/homebrew_tap

  publish-aur:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Download rendered manifests
        if: env.HAS_AUR_KEY == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-manifests
          path: manifests
      - name: Push jamly-bin to AUR
        if: env.HAS_AUR_KEY == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_KEY}" > ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/jamly-bin.git aur-repo
          cp manifests/aur/jamly-bin/PKGBUILD manifests/aur/jamly-bin/.SRCINFO \
             manifests/aur/jamly-bin/jamly.desktop manifests/aur/jamly-bin/jamly.svg aur-repo/
          cd aur-repo
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PKGBUILD .SRCINFO jamly.desktop jamly.svg
            git commit -m "jamly-bin: release ${VERSION}"
            git push origin HEAD:master
          fi
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/aur

  publish-winget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Download rendered manifests
        if: env.HAS_WINGET_TOKEN == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-manifests
          path: manifests
      - name: Submit PR to microsoft/winget-pkgs
        if: env.HAS_WINGET_TOKEN == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:VERSION.TrimStart('v')
          $wingetcreateUrl = "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe"
          $expectedSha256 = "24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea"
          Invoke-WebRequest -Uri $wingetcreateUrl -OutFile "wingetcreate.exe"
          $actualSha256 = (Get-FileHash -Path "wingetcreate.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "wingetcreate.exe SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          .\wingetcreate.exe submit ".\manifests\winget\kurtisnotcurtis.Jamly\$ver\"
