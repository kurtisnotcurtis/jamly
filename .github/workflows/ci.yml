name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install ffmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d
      - run: uv sync --locked
      - name: Run dev-check suite (version, doctor, pytest, ruff, Node, wheel smoke)
        run: uv run --locked python tools/dev-check.py
      - name: Install Playwright E2E runner
        if: matrix.python == '3.12'
        run: npm ci --prefix tests/e2e
      - name: Playwright companion & extension E2E
        if: matrix.python == '3.12'
        timeout-minutes: 5
        run: node --test tests/e2e/companion.e2e.test.mjs
      - name: Real generated-audio pipeline
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run --no-sync python -m unittest discover -s tests -p integration_pipeline.py
      - name: Real Chrome companion workflow
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        timeout-minutes: 15
        run: node tools/browser_smoke.mjs
